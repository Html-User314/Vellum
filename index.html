<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vellum vector editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --font-ui:"Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --bg:#eef0f4; --panel:#ffffff; --panel-2:#f3f5f8; --field:#f1f3f7; --line:#e3e6ec; --line-2:#d2d7e0;
  --text:#182030; --muted:#667085; --faint:#98a1b3;
  --accent:#4b3cff; --accent-2:#3a2be6; --accent-ink:#ffffff; --accent-soft:rgba(75,60,255,.10);
  --guide:#ff2d78; --zone-m:#6d4aff; --zone-w:#0a8f80; --measure:#f04438; --pasteboard:#dfe3ea; --dot:rgba(24,32,48,.09);
  --ok:#12a150;
  --shadow-1:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.05);
  --shadow-2:0 18px 40px -12px rgba(16,24,40,.22), 0 2px 6px rgba(16,24,40,.06);
  --scrim:rgba(15,17,22,.38);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1015; --panel:#16191f; --panel-2:#1d2129; --field:#21252e; --line:#262b34; --line-2:#363c48;
    --text:#e8ebf1; --muted:#9aa3b5; --faint:#687083;
    --accent:#8f86ff; --accent-2:#a7a0ff; --accent-ink:#0e1015; --accent-soft:rgba(143,134,255,.16);
    --guide:#ff4f93; --zone-m:#a28dff; --zone-w:#3cc9b5; --measure:#ff6b5e; --pasteboard:#0b0d11; --dot:rgba(255,255,255,.05);
    --ok:#3ccf7c;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 18px 44px -10px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.35);
    --scrim:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1015; --panel:#16191f; --panel-2:#1d2129; --field:#21252e; --line:#262b34; --line-2:#363c48;
  --text:#e8ebf1; --muted:#9aa3b5; --faint:#687083;
  --accent:#8f86ff; --accent-2:#a7a0ff; --accent-ink:#0e1015; --accent-soft:rgba(143,134,255,.16);
  --guide:#ff4f93; --zone-m:#a28dff; --zone-w:#3cc9b5; --measure:#ff6b5e; --pasteboard:#0b0d11; --dot:rgba(255,255,255,.05);
  --ok:#3ccf7c;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 18px 44px -10px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.35);
  --scrim:rgba(0,0,0,.55);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;font:13px/1.4 var(--font-ui);color:var(--text);background:var(--panel);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{font:inherit;color:inherit}
kbd{font:500 11px/1 var(--font-ui);padding:3px 5px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.ic{display:block;flex:none}
.app{height:100%;display:grid;grid-template-rows:54px minmax(0,1fr)}

/* header */
header.top{display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0;position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;font-size:15.5px;letter-spacing:-.015em;padding-right:6px}
.docname{height:32px;border:1px solid transparent;background:transparent;border-radius:8px;padding:0 8px;width:180px;color:var(--muted);font-weight:500;text-overflow:ellipsis}
.docname:hover{border-color:var(--line)}
.docname:focus{outline:none;border-color:var(--accent);color:var(--text);background:var(--panel)}
.spacer{flex:1}
.vsep{width:1px;height:20px;background:var(--line);margin:0 4px;flex:none}
.iconbtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none;position:relative}
.iconbtn:hover{background:var(--panel-2);color:var(--text)}
.iconbtn.on{background:var(--accent-soft);color:var(--accent)}
.iconbtn:disabled{opacity:.35;pointer-events:none}
.search{display:flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 10px;border-radius:9px;background:var(--field);color:var(--muted);min-width:200px;margin-right:4px}
.search:hover{color:var(--text)}
.search span{flex:1;text-align:left}
.save{font-size:12px;color:var(--faint);padding:0 8px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.save i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block}
.save.busy i{background:var(--faint)}
.primary{display:flex;align-items:center;gap:7px;height:34px;padding:0 14px 0 12px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;flex:none}
.primary:hover{background:var(--accent-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 12px;border-radius:9px;background:var(--field);font-weight:500}
.btn:hover{background:var(--line)}
.btn.wide{width:100%}

/* layout */
.main{display:grid;grid-template-columns:var(--lw,236px) minmax(0,1fr) var(--pw,288px);min-height:0}
body.no-layers{--lw:0px} body.no-layers #layers{display:none}
body.no-props{--pw:0px} body.no-props #props{display:none}
aside.panel{background:var(--panel);min-height:0;overflow:auto;overscroll-behavior:contain}
#layers{border-right:1px solid var(--line);display:flex;flex-direction:column}
#props{border-left:1px solid var(--line)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 8px;font-weight:600}
.count{color:var(--faint);font-weight:500;font-size:12px}

/* stage */
#stage{position:relative;overflow:hidden;background-color:var(--pasteboard);background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:18px 18px;touch-action:none;user-select:none;-webkit-user-select:none;min-width:0}
#canvas,#overlay{position:absolute;inset:0;width:100%;height:100%;display:block}
#overlay{pointer-events:none;overflow:visible}
#overlay [data-handle]{pointer-events:all}
#overlay .hover{fill:none;stroke:var(--accent);stroke-width:1.5}
#overlay .selbox{fill:none;stroke:var(--accent);stroke-width:1.5}
#overlay .selbox.locked{stroke-dasharray:4 3}
#overlay .selthin{fill:none;stroke:var(--accent);stroke-width:1;opacity:.75}
#overlay .h-c{fill:#fff;stroke:var(--accent);stroke-width:1.5;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.25))}
#overlay .h-s{fill:#fff;stroke:var(--accent);stroke-width:1.5;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.25))}
#overlay .h-rot{fill:#fff;stroke:var(--line-2);stroke-width:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
#overlay .h-rot-i{fill:none;stroke:#182030;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#overlay .marq{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1}
#overlay .gl{stroke:var(--guide);stroke-width:1}
#overlay .gs{stroke:var(--guide);stroke-width:1}
#overlay .gb rect{fill:var(--guide)}
#overlay .gb text{fill:#fff;font:600 10.5px var(--font-ui)}
#overlay .ms{stroke:var(--measure);stroke-width:1}
#overlay .mb rect{fill:var(--measure)}
#overlay .mb text{fill:#fff;font:600 10.5px var(--font-ui)}
#overlay .node{fill:#fff;stroke:var(--accent);stroke-width:1.5}
#overlay .node.on{fill:var(--accent)}
#overlay .hl{stroke:var(--accent);stroke-width:1;opacity:.8}
#overlay .hd{fill:#fff;stroke:var(--accent);stroke-width:1.5}
#overlay .penprev{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 4}
.page-rect{filter:url(#pageShadow)}

/* floating ui on stage */
.float{position:absolute;z-index:5;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-2)}
#toolbar{left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;padding:5px;border-radius:14px;max-height:calc(100% - 24px);overflow:auto;scrollbar-width:none}
#toolbar::-webkit-scrollbar{display:none}
.tool{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--text);position:relative;flex:none}
.tool:hover{background:var(--panel-2)}
.tool.on{background:var(--accent);color:var(--accent-ink)}
.tool.lockd::after{content:"";position:absolute;right:4px;bottom:4px;width:5px;height:5px;border-radius:50%;background:currentColor}
.tsep{height:1px;background:var(--line);margin:4px 7px;flex:none}
#hint{left:64px;right:180px;bottom:12px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding:0;background:none;border:0;box-shadow:none;color:var(--muted);font-size:12px;pointer-events:none}
#hint .hk{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
#hint kbd{background:var(--panel)}
#zoombar{right:12px;bottom:12px;display:flex;align-items:center;gap:2px;padding:3px;border-radius:12px}
#zoombar .iconbtn{width:30px;height:30px}
#zoomLabel{min-width:56px;height:30px;border-radius:8px;font-weight:600;font-variant-numeric:tabular-nums;font-size:12px}
#zoomLabel:hover{background:var(--panel-2)}
#ctip{position:absolute;pointer-events:none;background:var(--accent);color:var(--accent-ink);font:600 11px/1 var(--font-ui);padding:5px 7px;border-radius:6px;z-index:6;white-space:nowrap;font-variant-numeric:tabular-nums;display:none}
#textEditor{position:absolute;display:none;border:0;outline:1.5px solid var(--accent);outline-offset:3px;border-radius:1px;background:transparent;resize:none;overflow:hidden;white-space:pre;padding:0 3px;margin:0;z-index:4;transform-origin:50% 50%;caret-color:var(--accent);box-sizing:border-box}
#dropHint{position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:16px;display:none;place-items:center;font-weight:600;font-size:15px;color:var(--accent);background:var(--accent-soft);z-index:7;pointer-events:none}
#stage.dropping #dropHint{display:grid}

/* layers */
#layerList{flex:1;overflow:auto;padding-bottom:10px}
.lrow{display:flex;align-items:center;gap:6px;height:30px;padding-right:4px;border-radius:8px;margin:1px 6px;position:relative;cursor:default}
.lrow:hover{background:var(--panel-2)}
.lrow.sel{background:var(--accent-soft)}
.lrow.dim .lname,.lrow.dim .lic{opacity:.45}
.lrow .lname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .lname input{width:100%;height:24px;border:1px solid var(--accent);border-radius:6px;padding:0 6px;background:var(--panel);outline:none}
.lic{color:var(--muted);display:grid;place-items:center}
.lrow.sel .lic{color:var(--accent)}
.lact{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--muted);opacity:0}
.lact:hover{background:var(--line);color:var(--text)}
.lrow:hover .lact,.lact.active{opacity:1}
.caret{width:16px;height:16px;display:grid;place-items:center;color:var(--faint);transition:transform .15s}
.caret.open{transform:rotate(90deg)}
.caret-sp{width:16px;flex:none}
.lrow.db::before,.lrow.da::after{content:"";position:absolute;left:6px;right:6px;height:2px;background:var(--accent);border-radius:2px}
.lrow.db::before{top:-2px}.lrow.da::after{bottom:-2px}
.empty{margin:8px 14px;padding:16px;border:1px dashed var(--line-2);border-radius:12px;color:var(--muted);font-size:12.5px;line-height:1.5}

/* props */
.psec{padding:12px 14px 14px;border-bottom:1px solid var(--line)}
.psec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;font-weight:600;font-size:12.5px}
.psec-h .muted{font-weight:500}
.muted{color:var(--muted);font-size:12px}
.selhead{display:flex;align-items:center;gap:8px;padding:12px 10px 12px 14px;border-bottom:1px solid var(--line)}
.selhead .selic{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.selhead .selname{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.mt{margin-top:6px}
.row{display:flex;align-items:center;gap:6px}
.row>.grow{flex:1;min-width:0}
.nf{display:flex;align-items:center;height:30px;background:var(--field);border-radius:8px;border:1px solid transparent;min-width:0}
.nf:hover{border-color:var(--line-2)}
.nf:focus-within{border-color:var(--accent);background:var(--panel)}
.nf-l{min-width:24px;padding:0 4px 0 8px;color:var(--muted);cursor:ew-resize;font-size:11.5px;user-select:none;display:flex;align-items:center;height:100%;touch-action:none}
.nf input{flex:1;min-width:0;width:100%;border:0;background:transparent;height:100%;padding:0 8px 0 2px;outline:none;font-variant-numeric:tabular-nums}
.sel-in{height:30px;border-radius:8px;border:1px solid transparent;background:var(--field);padding:0 6px;min-width:0;width:100%;outline:none}
.sel-in:hover{border-color:var(--line-2)}
.sel-in:focus{border-color:var(--accent)}
.aligns{display:flex;justify-content:space-between;align-items:center}
.aligns .iconbtn{width:29px;height:29px}
.btnrow{display:flex;flex-wrap:wrap;gap:2px}
.seg{display:flex;background:var(--field);border-radius:8px;padding:2px;gap:2px}
.seg button{flex:1;height:26px;min-width:28px;border-radius:6px;display:grid;place-items:center;color:var(--muted);font-size:12px;font-weight:500;padding:0 6px}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow-1)}
.seg.sm button{height:24px;min-width:30px}
.colorrow{display:flex;align-items:center;gap:6px}
.swbtn{flex:1;display:flex;align-items:center;gap:8px;height:30px;padding:0 8px 0 4px;background:var(--field);border-radius:8px;border:1px solid transparent;min-width:0}
.swbtn:hover{border-color:var(--line-2)}
.swlabel{font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{width:22px;height:22px;border-radius:6px;flex:none;background:linear-gradient(var(--c),var(--c)),repeating-conic-gradient(#d6dae2 0 25%,#fff 0 50%) 0 0/8px 8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.sw.none{background:linear-gradient(to top right,transparent calc(50% - 1px),var(--measure) calc(50% - 1px),var(--measure) calc(50% + 1px),transparent calc(50% + 1px)),var(--panel)}
input[type=range]{width:100%;accent-color:var(--accent);height:20px;margin:0}
.rangerow{display:grid;grid-template-columns:1fr 64px;gap:8px;align-items:center}
.lab{font-size:12px;color:var(--muted);margin:2px 0 6px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:30px;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:32px;height:18px;border-radius:99px;background:var(--line-2);position:relative;flex:none;cursor:pointer;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(14px)}
.tipcard{background:var(--panel-2);border-radius:12px;padding:12px;line-height:1.5;color:var(--text)}
.tipcard p{margin:0 0 10px}
.stack{display:grid;gap:6px}

/* menus, popovers */
.menu{position:fixed;z-index:50;min-width:230px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-2);padding:6px}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:32px;padding:0 10px;border-radius:7px;text-align:left;color:var(--text)}
.mi .ic{color:var(--muted)}
.mi:hover,.mi.active{background:var(--panel-2)}
.mi .k{margin-left:auto;padding-left:16px;color:var(--faint);font-size:12px;white-space:nowrap}
.mi:disabled{opacity:.38;pointer-events:none}
.msep{height:1px;background:var(--line);margin:5px 4px}
.mh{padding:8px 10px 4px;font-size:12px;color:var(--muted);font-weight:500}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px;padding:0 10px;color:var(--text)}
.mrow small{color:var(--faint);font-size:11.5px}
.colorpop{width:252px;padding:10px}
.cp-top{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.cp-native{position:relative;width:34px;height:34px;flex:none;cursor:pointer}
.cp-native input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.cp-native .sw{width:34px;height:34px;border-radius:8px}
.cp-hex{flex:1;min-width:0;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--field);padding:0 8px;outline:none;font-variant-numeric:tabular-nums;text-transform:uppercase}
.cp-hex:focus{border-color:var(--accent)}
.cp-h{font-size:11.5px;color:var(--muted);margin:8px 2px 6px}
.cp-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.cp-grid .sw{width:100%;height:auto;aspect-ratio:1;border-radius:6px;cursor:pointer}
.cp-grid .sw:hover{transform:scale(1.12)}

/* tooltip, toasts */
#tip{position:fixed;z-index:90;pointer-events:none;background:var(--text);color:var(--panel);font-size:12px;font-weight:500;padding:6px 8px;border-radius:7px;opacity:0;transition:opacity .12s;display:flex;align-items:center;gap:7px;white-space:nowrap}
#tip.on{opacity:1}
#tip kbd{background:transparent;border-color:color-mix(in srgb,var(--panel) 30%,transparent);color:var(--panel);opacity:.8}
#toasts{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--text);color:var(--panel);padding:9px 14px;border-radius:10px;font-weight:500;box-shadow:var(--shadow-2);animation:tin .2s ease-out;max-width:calc(100vw - 32px)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* modals */
.modal-bg{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border-radius:18px;box-shadow:var(--shadow-2);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;position:relative}
.modal .x{position:absolute;right:10px;top:10px}
.welcome{padding:28px 28px 24px}
.welcome h1{font-size:26px;line-height:1.15;letter-spacing:-.025em;margin:16px 0 8px;font-weight:650}
.welcome p{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.55;max-width:44ch}
.choices{display:grid;gap:8px}
.choice{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;border:1px solid var(--line);text-align:left}
.choice:hover{border-color:var(--accent);background:var(--accent-soft)}
.choice b{display:block;font-size:14px;font-weight:600}
.choice span{color:var(--muted);font-size:12.5px}
.choice .ci{width:40px;height:40px;border-radius:11px;background:var(--panel-2);display:grid;place-items:center;flex:none;color:var(--accent)}
.choice.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.choice.main span{color:inherit;opacity:.8}
.choice.main .ci{background:rgba(255,255,255,.18);color:inherit}
.choice.main:hover{background:var(--accent-2)}
.keys{padding:24px 26px 26px}
.keys h2{margin:0 0 4px;font-size:20px;letter-spacing:-.02em}
.keys .kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 28px;margin-top:14px}
.keys h3{font-size:12.5px;margin:14px 0 6px;color:var(--muted);font-weight:600;grid-column:1/-1}
.krow{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line)}
.krow span:last-child{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.palette{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(580px,calc(100vw - 24px));background:var(--panel);border-radius:16px;box-shadow:var(--shadow-2);overflow:hidden;border:1px solid var(--line)}
.pal-in{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);color:var(--muted)}
.pal-in input{flex:1;height:52px;border:0;background:transparent;outline:none;font-size:15px;color:var(--text)}
.pal-list{max-height:min(52vh,420px);overflow:auto;padding:6px}
.pal-empty{padding:18px;color:var(--muted)}
.pal-bg{place-items:start center;background:rgba(15,17,22,.2)}

/* tour */
#tour{position:fixed;inset:0;z-index:70;pointer-events:none}
#tour[hidden]{display:none}
.card .tch{font-weight:600;color:var(--accent);white-space:nowrap}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 12px}
.tchip{height:28px;padding:0 10px;border-radius:99px;background:var(--panel-2);font-size:12px;font-weight:500;color:var(--text)}
.tchip:hover{background:var(--accent-soft);color:var(--accent)}
#tour .spot{position:absolute;border-radius:14px;box-shadow:0 0 0 9999px var(--scrim);outline:2px solid var(--accent);outline-offset:2px;transition:left .25s ease,top .25s ease,width .25s ease,height .25s ease}
#tour .card{position:absolute;pointer-events:auto;width:min(330px,calc(100vw - 24px));background:var(--panel);border-radius:16px;box-shadow:var(--shadow-2);padding:16px 16px 14px;border:1px solid var(--line)}
.card .step{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:6px}
.card .bar{flex:1;height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.card h3{margin:2px 0 6px;font-size:16px;letter-spacing:-.01em}
.card p{margin:0 0 12px;color:var(--muted);line-height:1.55}
.card .todo{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;background:var(--panel-2);margin-bottom:12px;font-weight:500}
.card .todo .dotw{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);flex:none}
.card.done .todo{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.card.done .todo .dotw{border-color:var(--ok);background:var(--ok);box-shadow:inset 0 0 0 3px var(--panel)}
.card .acts{display:flex;align-items:center;gap:6px}
.card .acts .grow{flex:1}
.linkbtn{color:var(--muted);font-weight:500;padding:6px 4px}
.linkbtn:hover{color:var(--text)}
.pulse{animation:pulse 1.5s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 12px transparent}}

.show-sm{display:none!important}
@media (max-width: 900px){
  .main{grid-template-columns:minmax(0,1fr)}
  aside.panel{position:fixed;top:calc(54px + env(safe-area-inset-top,0px));bottom:env(safe-area-inset-bottom,0px);width:min(320px,88vw);z-index:30;box-shadow:var(--shadow-2);transition:transform .22s ease}
  #layers{left:0;transform:translateX(-105%);display:flex!important}
  #props{right:0;transform:translateX(105%);display:block!important}
  body.show-layers #layers,body.show-props #props{transform:none}
  #toolbar{top:auto;bottom:12px;left:50%;transform:translateX(-50%);flex-direction:row;max-width:calc(100% - 24px);overflow-x:auto}
  .tsep{width:1px;height:auto;margin:7px 4px}
  #hint{display:none}
  #zoombar{bottom:72px}
  .hide-sm{display:none!important}
  .show-sm{display:grid!important}
  #toasts{bottom:calc(128px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
#tour .spot.nodim{box-shadow:none}
.seg button{display:flex;align-items:center;justify-content:center;gap:6px}
.mrow.switch{cursor:pointer}

/* v2 */
.iconbtn.sm{width:26px;height:26px}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:12px 8px 6px 14px;font-weight:600}
#pageList{padding:0 0 8px;border-bottom:1px solid var(--line);max-height:30%;overflow:auto;flex:none}
.prow{display:flex;align-items:center;gap:8px;height:32px;padding:0 4px 0 10px;margin:1px 6px;border-radius:8px;cursor:default}
.prow:hover{background:var(--panel-2)}
.prow.on{background:var(--accent-soft)}
.prow .lic{color:var(--muted)}
.prow.on .lic{color:var(--accent)}
.prow .pname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.prow .psize{color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums}
.prow .lact{display:none;opacity:1}.prow:hover .lact{display:grid}.prow:hover .psize{display:none}
.prow .pname input{width:100%;height:24px;border:1px solid var(--accent);border-radius:6px;padding:0 6px;background:var(--panel);outline:none}
#compSec{border-top:1px solid var(--line);max-height:32%;overflow:auto;flex:none;padding-bottom:8px}
#compSec:empty{display:none}
.crow{display:flex;align-items:center;gap:8px;height:32px;padding:0 4px 0 12px;margin:1px 6px;border-radius:8px;cursor:default}
.crow:hover{background:var(--panel-2)}
.crow .cname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .lic,.lrow .lic.comp{color:#9b51e0}
.lrow .tag{font-size:10.5px;color:var(--faint);padding:0 2px;white-space:nowrap}
#ctxbar{display:none;align-items:center;gap:2px;padding:4px;border-radius:12px;white-space:nowrap;transform:translateX(-50%);max-width:calc(100% - 16px);overflow-x:auto;scrollbar-width:none}
#ctxbar.on{display:flex}
#ctxbar .iconbtn{width:32px;height:32px;color:var(--text)}
#ctxbar .iconbtn.on{background:var(--accent);color:var(--accent-ink)}
#ctxbar .vsep{height:22px}
#ctxbar .tbtn{height:32px;padding:0 12px;border-radius:8px;font-weight:600;background:var(--accent);color:var(--accent-ink);margin-left:2px}
#overlay .segh{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;opacity:.45}
#overlay .nmarq{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1;stroke-dasharray:3 3}
.colorpop{width:284px;padding:10px}
.cp-tabs{margin-bottom:10px}
.cp-sv{position:relative;height:150px;border-radius:10px;cursor:crosshair;touch-action:none;background:linear-gradient(to top,#000,rgba(0,0,0,0)),linear-gradient(to right,#fff,var(--hue,red))}
.cp-thumb{position:absolute;width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none}
.cp-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.cp-sliders{flex:1;display:grid;gap:10px;min-width:0}
.cp-hue,.cp-alpha{position:relative;height:12px;border-radius:6px;cursor:pointer;touch-action:none}
.cp-hue{background:linear-gradient(90deg,#f00,#ff0 17%,#0f0 33%,#0ff 50%,#00f 67%,#f0f 83%,#f00)}
.cp-alpha{background:linear-gradient(90deg,rgba(0,0,0,0),var(--solid,#000)),repeating-conic-gradient(#d6dae2 0 25%,#fff 0 50%) 0 0/8px 8px}
.cp-knob{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.3);transform:translate(-50%,-50%);pointer-events:none}
.cp-prev{width:38px;height:38px;border-radius:10px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.cp-fields{display:grid;grid-template-columns:2.2fr 1fr 1fr 1fr 1.1fr;gap:4px;margin-top:10px}
.cp-fields input{width:100%;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--field);padding:0 2px;text-align:center;min-width:0;font-variant-numeric:tabular-nums;outline:none;font-size:12px}
.cp-fields input:focus{border-color:var(--accent);background:var(--panel)}
.cp-fields label{font-size:10.5px;color:var(--faint);text-align:center;display:block;margin-top:3px}
.cp-gbar{position:relative;height:24px;border-radius:7px;margin:4px 9px 10px;cursor:copy;touch-action:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.cp-stop{position:absolute;top:50%;width:16px;height:30px;border-radius:5px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.45);transform:translate(-50%,-50%);cursor:grab;touch-action:none}
.cp-stop.on{box-shadow:0 0 0 2px var(--accent),0 0 0 4px #fff}
.cp-grow{display:flex;align-items:center;gap:4px;margin-bottom:10px}
.cp-none{margin-top:10px}
.cp-grid.pal{grid-template-columns:repeat(12,1fr);gap:3px}
.cp-grid.pal .sw{border-radius:4px}
.cp-grid.grads{grid-template-columns:repeat(6,1fr)}
.cp-grid .sw{border:0;padding:0}
.libpop{width:356px;padding:10px}
.lib-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.lib-item{display:grid;justify-items:center;gap:4px;padding:8px 2px 6px;border-radius:10px;font-size:11px;color:var(--muted);text-align:center;line-height:1.2}
.lib-item:hover{background:var(--panel-2);color:var(--text)}
.lib-item svg{width:36px;height:36px}
details.psec>summary{cursor:pointer;font-weight:600;font-size:12.5px;list-style:none;display:flex;align-items:center;justify-content:space-between}
details.psec>summary::-webkit-details-marker{display:none}
details.psec>summary::after{content:"";width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
details.psec[open]>summary::after{transform:rotate(45deg)}
details.psec[open]>summary{margin-bottom:10px}
.btn.on{background:var(--accent-soft);color:var(--accent)}
.btn:disabled{opacity:.45;pointer-events:none}
.ptypes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.ptypes button{display:grid;justify-items:center;gap:3px;padding:7px 2px 6px;border-radius:9px;background:var(--field);font-size:11px;color:var(--muted)}
.ptypes button:hover{color:var(--text)}
.ptypes button.on{background:var(--accent-soft);color:var(--accent)}
.mrow input.mini{width:64px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--field);padding:0 6px;text-align:right;outline:none;color:var(--text)}
.bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.bgrid button{display:grid;justify-items:center;gap:3px;padding:7px 2px 6px;border-radius:9px;background:var(--field);font-size:11px;color:var(--muted)}
.bgrid button:hover{color:var(--text);background:var(--line)}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 8px}

.fxpresets{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:10px}
.fxp{display:grid;justify-items:center;gap:1px;padding:4px 2px 5px;border-radius:9px;background:var(--field);font-size:10.5px;color:var(--muted);overflow:hidden}
.fxp:hover{color:var(--text);background:var(--line)}
.fxp svg{width:56px;height:36px;display:block}
.fxrow{background:var(--panel-2);border-radius:10px;padding:6px;margin-top:6px}
.fxhead{display:flex;align-items:center;gap:4px;font-weight:600;font-size:12px}
.fxhead .iconbtn.sm{width:24px;height:24px}
.fxbody{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}
.fxbody .nf{height:28px}
.swmini{display:flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 3px;background:var(--field);border-radius:8px;min-width:0;border:1px solid transparent}
.swmini:hover{border-color:var(--line-2)}
.swmini .sw{width:20px;height:20px}
.swmini .swlabel{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selcols{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.selcols button{border:0;padding:0;background:none;border-radius:7px}
.selcols .sw{display:block;width:100%;height:auto;aspect-ratio:1;border-radius:7px}
.palrow{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.palbtn{display:flex;height:26px;border-radius:7px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.palbtn i{flex:1}
.palbtn:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.stylepop{width:296px;padding:10px}
#overlay .bfrag{fill:transparent;stroke:var(--accent);stroke-width:1;stroke-dasharray:4 3}
#overlay .bfrag.hv{fill:rgba(75,60,255,.18)}
#overlay .bfrag.on{fill:rgba(75,60,255,.36);stroke-dasharray:none}
#overlay .bfrag.del{fill:rgba(240,68,56,.32);stroke:var(--measure);stroke-dasharray:none}
#overlay .btrail{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#overlay .btrail.del{stroke:var(--measure)}
#overlay .h-rad{fill:#fff;stroke:var(--accent);stroke-width:1.5;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.25))}

#ctxbar .sbtn{height:30px;padding:0 10px;border-radius:8px;font-weight:600;font-size:12px;color:var(--text)}
#ctxbar .sbtn:hover{background:var(--panel-2)}
#ctxbar .sbtn.on{background:var(--accent);color:var(--accent-ink)}
#ctxbar .clabel{font-size:12px;color:var(--muted);padding:0 6px 0 8px}
#ctxbar .tbtn2{height:32px;padding:0 10px;border-radius:8px;font-weight:600;font-size:12px;background:var(--accent-soft);color:var(--accent)}
#ctxbar .tbtn2:hover{background:var(--accent);color:var(--accent-ink)}
#overlay .h-nround{fill:var(--accent);stroke:#fff;stroke-width:1.5;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.3))}
.npad{display:grid;grid-template-columns:repeat(3,30px);gap:3px}
.npad button{width:30px;height:30px;border-radius:8px;background:var(--field);display:grid;place-items:center;color:var(--muted)}
.npad button:hover{background:var(--line);color:var(--text)}

.tool .tchev{position:absolute;right:3px;bottom:3px;width:0;height:0;border-left:5px solid transparent;border-bottom:5px solid currentColor;opacity:.5;pointer-events:auto}
.tool .tchev::after{content:"";position:absolute;right:-3px;bottom:-3px;width:14px;height:14px}
.psec-h{cursor:pointer;user-select:none}
.psec-h .pchev{width:7px;height:7px;border-right:1.6px solid var(--faint);border-bottom:1.6px solid var(--faint);transform:rotate(45deg);margin:0 3px 3px 6px;transition:transform .15s;flex:none}
.psec-h>span:first-child{flex:1}
.psec.collapsed .psec-h .pchev{transform:rotate(-45deg);margin-bottom:0}
.psec.collapsed>*:not(.psec-h){display:none!important}
.psec.collapsed .psec-h{margin-bottom:0}
.psec-h:hover .pchev{border-color:var(--text)}
.subdet{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.subdet>summary{cursor:pointer;font-size:12px;color:var(--muted);font-weight:500;list-style:none;display:flex;align-items:center;gap:6px}
.subdet>summary::-webkit-details-marker{display:none}
.subdet>summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.subdet[open]>summary::before{transform:rotate(45deg)}
.subdet[open]>summary{margin-bottom:8px}
.docwrap{display:flex;flex-direction:column;justify-content:center;min-width:0}
.docwrap .save{padding:0 8px;font-size:11px;line-height:1}
#zoombar .vsep{height:18px;margin:0 2px}

#overlay .gdot{fill:var(--guide)}
#overlay .brush{fill:none;stroke:var(--accent);stroke-width:1.5}
#overlay .brush.carve{stroke:var(--measure)}
#overlay .brush.add{stroke:var(--ok)}
#overlay .sprev{fill:none;stroke-linecap:round;stroke-linejoin:round}
#overlay .sprev.line{stroke:var(--accent);stroke-dasharray:5 4}
#overlay .sprev.carve{stroke:rgba(240,68,56,.28)}
#overlay .sprev.add{stroke:rgba(18,161,80,.28)}
#ctxbar .sctl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:0 6px;white-space:nowrap}
#ctxbar .sctl input{width:88px}
#ctxbar .seg button{padding:0 8px}

#overlay .ghost .arr{fill:#fff;stroke:#16181d;stroke-width:1.2;stroke-linejoin:round}
#overlay .ghost circle{stroke:#fff;stroke-width:1.5}
#overlay .ghost.mirror circle{fill:var(--zone-m)}
#overlay .ghost.warp circle{fill:var(--zone-w)}
.tag.ztag.mirror{color:var(--zone-m)}
.tag.ztag.warp{color:var(--zone-w)}
#overlay .repsel{fill:none;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:4 3;opacity:.75}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand" aria-label="Vellum">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M5 20.5C8 7 17 21 21 5.5" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/><path d="M21 5.5 L14.5 3.2" stroke="var(--muted)" stroke-width="1.3" stroke-linecap="round"/><circle cx="14.5" cy="3.2" r="1.7" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.3"/><rect x="2.6" y="18.1" width="4.8" height="4.8" rx="1.2" fill="var(--panel)" stroke="var(--text)" stroke-width="1.5"/><rect x="18.6" y="3.1" width="4.8" height="4.8" rx="1.2" fill="var(--accent)" stroke="var(--accent)" stroke-width="1.5"/></svg>
      <span class="hide-sm">Vellum</span>
    </div>
    <div class="docwrap hide-sm"><input id="docName" class="docname" spellcheck="false" aria-label="Design name" value="Untitled design"><span id="saveState" class="save" data-tip="Autosaves in this browser"><i></i><span>Saved</span></span></div>
    <button class="iconbtn" id="undoBtn" data-tip="Undo" data-key="Ctrl Z" aria-label="Undo"></button>
    <button class="iconbtn" id="redoBtn" data-tip="Redo" data-key="Ctrl Shift Z" aria-label="Redo"></button>
    <div class="spacer"></div>
    <button id="cmdBtn" class="search hide-sm" aria-label="Search actions"><span>Search actions</span><kbd id="cmdKey">Ctrl K</kbd></button>
    <button class="iconbtn show-sm" id="cmdBtnSm" aria-label="Search actions"></button>
    <button class="iconbtn" id="helpBtn" data-tip="Help, tour and settings" aria-label="Help and settings"></button>
    <span class="vsep hide-sm"></span>
    <button class="iconbtn" id="layersBtn" data-tip="Layers panel" aria-label="Layers panel"></button>
    <button class="iconbtn" id="propsBtn" data-tip="Design panel" aria-label="Design panel"></button>
    <button id="exportBtn" class="primary" aria-haspopup="menu"><span id="exportIc"></span><span class="hide-sm">Export</span></button>
  </header>
  <div class="main">
    <aside id="layers" class="panel" aria-label="Layers">
      <div class="sec-h"><span>Pages</span><button class="iconbtn sm" id="addPageBtn" data-tip="Add page" aria-label="Add page"></button></div>
      <div id="pageList"></div>
      <div class="ph"><span>Layers</span><span id="layerCount" class="count"></span></div>
      <div id="layerList"></div>
      <div id="compSec"></div>
    </aside>
    <div id="stage">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg"><g id="content"></g></svg>
      <svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>
      <textarea id="textEditor" spellcheck="false" autocomplete="off" aria-label="Edit text"></textarea>
      <div id="ctip"></div>
      <div id="toolbar" class="float float-ui" role="toolbar" aria-label="Tools"></div>
      <div id="ctxbar" class="float float-ui" role="toolbar" aria-label="Selection actions"></div>
      <div id="hint" class="float float-ui" aria-live="polite"></div>
      <div id="zoombar" class="float float-ui">
        <button class="iconbtn" id="snapBtn" data-tip="Smart guides and snapping" data-key="Shift S" aria-label="Toggle snapping"></button>
        <button class="iconbtn" id="gridBtn" data-tip="Grid" data-key="Shift G" aria-label="Toggle grid"></button>
        <span class="vsep"></span>
        <button class="iconbtn" id="zoomOut" data-tip="Zoom out" data-key="−" aria-label="Zoom out"></button>
        <button id="zoomLabel" data-tip="Zoom options" aria-label="Zoom options">100%</button>
        <button class="iconbtn" id="zoomIn" data-tip="Zoom in" data-key="+" aria-label="Zoom in"></button>
      </div>
      <div id="dropHint">Drop images to add them to your design</div>
    </div>
    <aside id="props" class="panel" aria-label="Design"><div id="propsBody"></div></aside>
  </div>
</div>
<div id="tour" hidden><div class="spot"></div><div class="card" role="dialog" aria-live="polite"></div></div>
<div id="toasts" aria-live="polite"></div>

<input type="file" id="fileProj" accept=".json,application/json" hidden>

<script>
'use strict';
/* ================= utilities ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 10);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function openPalette() {

  document.body.appendChild(wrap);
  const input = wrap.querySelector('input'), list = wrap.querySelector('.pal-list');
  const all = commandList().filter(c => !c.when || c.when());
  let items = [], active = 0;
  const draw = () => {
    const words = input.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    items = all.filter(c => words.every(w => c.label.toLowerCase().includes(w))).slice(0, 80);
    active = clamp(active, 0, Math.max(0, items.length - 1));
    list.innerHTML = items.length ? items.map((c, i) => `<button class="mi${i === active ? ' active' : ''}" data-i="${i}" role="option">${icon(c.icon || 'dot', 16)}<span>${esc(c.label)}</span>${c.k ? `<span class="k">${esc(keyLabel(c.k))}</span>` : ''}</button>`).join('') : `<div class="pal-empty">No actions match. Try “align”, “export” or “star”.</div>`;

  const close = () => wrap.remove();
  const run = c => { if (!c) return; close(); c.run(); };
  input.addEventListener('input', () => { active = 0; draw(); });
  input.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(items.length - 1, active + 1); draw(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(0, active - 1); draw(); }
    else if (e.key === 'Enter') { e.preventDefault(); run(items[active]); }
    else if (e.key === 'Escape') { e.preventDefault(); close(); }
  });
  list.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) run(items[+b.dataset.i]); });

}

function tourSelectPair() { tourSelectTool(); if (selObjs().filter(shapeLike).length >= 2) return; const shapes = [...doc.objects].reverse().filter(o => !o.hidden && !o.locked && shapeLike(o)); if (shapes.length >= 2) { sel = [shapes[0].id, shapes[1].id]; selectionChanged(); } }
function tutorialEvent(name) { tour.f[name] = true; if (tour.on) { setTimeout(checkTour, 0); if (name === 'sel' && TOUR[tour.i] && TOUR[tour.i].todo && !TOUR[tour.i].target) requestAnimationFrame(() => requestAnimationFrame(drawTour)); } }

function startTour() {

}
function showTourStep() {

function drawTour() {

  el.hidden = false;

    <h3>${st.title}</h3><p>${keyLabel(st.body)}</p>
    ${st.welcome ? `<div class="tchips">${TOUR_CHAPTERS.map((c, i) => `<button class="tchip" data-t="ch:${i}">${i + 1}. ${c}</button>`).join('')}</div>` : ''}
    ${st.todo ? `<div class="todo"><span class="dotw"></span><span>${tour.done ? 'Done' : st.todo}</span></div>` : ''}
    <div class="acts">${tour.i > 0 ? '<button class="linkbtn" data-t="back">Back</button>' : '<button class="linkbtn" data-t="end">Skip the tour</button>'}${!st.welcome && nextCh > 0 ? '<button class="linkbtn" data-t="chapter">Skip chapter</button>' : ''}<span class="grow"></span>
    ${st.todo && !tour.done ? '<button class="linkbtn" data-t="next">Skip step</button>' : `<button class="primary" data-t="next">${last ? 'Finish' : st.welcome ? 'Start' : 'Next'}</button>`}</div>`;
  const tEl = st.target ? $(st.target) : null, ok = visibleEl(tEl), r = ok ? tEl.getBoundingClientRect() : null;
  if (r) { spot.style.display = 'block'; spot.classList.toggle('nodim', !!st.todo); Object.assign(spot.style, { left: (r.left - 4) + 'px', top: (r.top - 4) + 'px', width: (r.width + 8) + 'px', height: (r.height + 8) + 'px' }); }
  else { spot.style.display = st.todo ? 'none' : 'block'; if (!st.todo) Object.assign(spot.style, { left: (innerWidth / 2) + 'px', top: (innerHeight / 2) + 'px', width: '0px', height: '0px' }); spot.classList.remove('nodim'); }

  if (!r && st.todo) {

    if (bar && bar.classList.contains('on')) { const br = bar.getBoundingClientRect(); avoid.push({ left: br.left - 10, top: br.top - 10, right: br.right + 10, bottom: br.bottom + 10 }); }
    const so = selObjs(); if (so.length) { const bb = selBox(so), a = w2s(bb), z = view.zoom; avoid.push({ left: s.left + a.x - 36, top: s.top + a.y - 36, right: s.left + a.x + bb.w * z + 36, bottom: s.top + a.y + bb.h * z + 56 }); }
    const cands = [[s.left + (s.width - cw) / 2, s.top + 14], [s.left + (s.width - cw) / 2, s.bottom - ch - 64], [s.right - cw - 14, s.top + 14], [s.left + 72, s.top + 14], [s.right - cw - 14, s.bottom - ch - 64], [s.left + 72, s.bottom - ch - 64]];

function checkTour() {

function tourGo(d) { const ni = tour.i + d; if (ni >= TOUR.length) { endTour(true); return; } tour.i = clamp(ni, 0, TOUR.length - 1); showTourStep(); }
function endTour(finished) {

$('#tour .card').addEventListener('click', e => {

});
const LOGO_BIG = '<svg width="52" height="52" viewBox="0 0 26 26" aria-hidden="true"><path d="M5 20.5C8 7 17 21 21 5.5" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"/><path d="M21 5.5 L14.5 3.2" stroke="var(--muted)" stroke-width="1.1" stroke-linecap="round"/><circle cx="14.5" cy="3.2" r="1.5" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.1"/><rect x="2.6" y="18.1" width="4.8" height="4.8" rx="1.2" fill="var(--panel)" stroke="var(--text)" stroke-width="1.3"/><rect x="18.6" y="3.1" width="4.8" height="4.8" rx="1.2" fill="var(--accent)" stroke="var(--accent)" stroke-width="1.3"/></svg>';

  openModal(`<div class="welcome">${LOGO_BIG}<h1>Welcome to Vellum</h1><p>A small vector editor with smart guides, a pen tool and plenty of shortcuts. Your work stays in this browser.</p><div class="choices">

function init() {
